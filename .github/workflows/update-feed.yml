name: Publish signed update feed
on:
  release:
    types: [published]
permissions:
  contents: write
concurrency:
  group: update-feed
  cancel-in-progress: false
jobs:
  feed:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Download and validate release manifest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p "$RUNNER_TEMP/feed"
          gh release download "$RELEASE_TAG" --pattern latest.json --dir "$RUNNER_TEMP/feed"
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$RELEASE_TAG" --jq .assets > "$RUNNER_TEMP/feed/assets.json"
          node scripts/normalize-update-feed.mjs "$RUNNER_TEMP/feed/latest.json" "$RUNNER_TEMP/feed/assets.json"
          cp scripts/validate-update-feed.mjs "$RUNNER_TEMP/validate-update-feed.mjs"
          node "$RUNNER_TEMP/validate-update-feed.mjs" "$RUNNER_TEMP/feed/latest.json" "$RELEASE_TAG"
      - name: Update feed branch
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git fetch origin refs/heads/update-feed; then
            git checkout -B update-feed FETCH_HEAD
          else
            git checkout --orphan update-feed
            git rm -rf .
          fi
          if [ -f latest.json ]; then
            node "$RUNNER_TEMP/validate-update-feed.mjs" "$RUNNER_TEMP/feed/latest.json" "$RELEASE_TAG" latest.json
          fi
          cp "$RUNNER_TEMP/feed/latest.json" latest.json
          git add latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Update feed for $RELEASE_TAG"
            git push origin HEAD:update-feed
          fi
