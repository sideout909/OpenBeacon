name: Linux test build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libudev-dev cmake
      - run: npm ci
      - run: scripts/build-direwolf-linux.sh
      - run: npm run check
      - run: npm run tauri build -- --no-bundle
      - name: Assemble test archive
        run: |
          mkdir -p openbeacon-linux-x86_64/maps
          cp src-tauri/target/release/openbeacon-map-test openbeacon-linux-x86_64/openbeacon
          cp public/maps/world-z6.pmtiles openbeacon-linux-x86_64/maps/
          cp src-tauri/resources/direwolf-linux-x86_64 src-tauri/resources/pmtiles-linux-x86_64.gz openbeacon-linux-x86_64/
          cp README.md USER_GUIDE.md LICENSE THIRD-PARTY-NOTICES.md openbeacon-linux-x86_64/
          cp -a third-party openbeacon-linux-x86_64/
          mkdir -p openbeacon-linux-x86_64/third-party/{fonts,aprs-symbols,aprs-deviceid}
          cp public/fonts/OFL.txt openbeacon-linux-x86_64/third-party/fonts/
          cp public/aprs-symbols/COPYRIGHT.md openbeacon-linux-x86_64/third-party/aprs-symbols/
          cp src/data/README.md src/data/aprs-deviceid.json openbeacon-linux-x86_64/third-party/aprs-deviceid/
          tar -czf openbeacon-linux-x86_64.tar.gz openbeacon-linux-x86_64
      - uses: actions/upload-artifact@v6
        with:
          name: openbeacon-linux-x86_64
          path: openbeacon-linux-x86_64.tar.gz
          if-no-files-found: error
