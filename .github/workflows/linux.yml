name: Linux checks
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Tauri Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      # Resource declarations require paths; maps themselves are supplied separately.
      - run: mkdir -p public/maps && touch public/maps/world-z6.pmtiles public/maps/michigan-lower-z12.pmtiles
      # Map packs are not committed; this verifies builds, not map assets or offline behavior.
      - run: npm run build
      - run: npm run check
