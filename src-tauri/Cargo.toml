[package]
name = "openbeacon-map-test"
version = "0.2.0-beta.1"
edition = "2021"
license = "GPL-3.0-or-later"

[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
openbeacon-packet = { path = "../crates/openbeacon-packet" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serialport = { version = "4", default-features = false }
tempfile = "3"
libc = "0.2"
flate2 = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls", "query"] }
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.4.0"
